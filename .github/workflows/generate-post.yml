name: Daily Post Pipeline

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  parse-topic:
    # Only run for issues opened by the repo owner, carrying the "new-post" label.
    # This stops random public users from triggering the pipeline on a public repo.
    if: >
      github.event.issue.user.login == github.repository_owner &&
      contains(github.event.issue.labels.*.name, 'new-post')
    runs-on: ubuntu-latest
    outputs:
      topic: ${{ steps.extract.outputs.topic }}
      category: ${{ steps.extract.outputs.category }}
      angle: ${{ steps.extract.outputs.angle }}
      slug: ${{ steps.extract.outputs.slug }}
      issue_number: ${{ github.event.issue.number }}
    steps:
      - name: Extract fields from issue form
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";

            function extractField(label) {
              const regex = new RegExp(`### ${label}\\s*\\n\\s*([\\s\\S]*?)(?=\\n### |$)`, "i");
              const match = body.match(regex);
              return match ? match[1].trim() : "";
            }

            const topic = extractField("Topic");
            const category = extractField("Category");
            const angleRaw = extractField("Angle or notes \\(optional\\)");
            const angle = angleRaw && angleRaw !== "_No response_" ? angleRaw : "None provided";

            const slug = topic
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, "-")
              .replace(/(^-|-$)/g, "")
              .slice(0, 60);

            if (!topic) {
              core.setFailed("Could not find a Topic field in the issue body.");
              return;
            }

            core.setOutput("topic", topic);
            core.setOutput("category", category);
            core.setOutput("angle", angle);
            core.setOutput("slug", slug);

      - name: Acknowledge on the issue
        uses: actions/github-script@v7
        env:
          TOPIC: ${{ steps.extract.outputs.topic }}
          CATEGORY: ${{ steps.extract.outputs.category }}
          ANGLE: ${{ steps.extract.outputs.angle }}
        with:
          script: |
            const topic = process.env.TOPIC;
            const category = process.env.CATEGORY;
            const angle = process.env.ANGLE;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                "🚀 **Pipeline triggered.**",
                "",
                `**Topic:** ${topic}`,
                `**Category:** ${category}`,
                `**Angle:** ${angle}`,
                "",
                "_Drafting the post next — this comment thread will update as each stage completes. (Content generation lands in Phase 3.)_"
              ].join("\n")
            });

  generate-content:
    needs: parse-topic
    runs-on: ubuntu-latest
    outputs:
      post_title: ${{ steps.generate.outputs.post_title }}
      post_path: ${{ steps.generate.outputs.post_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute run number
        id: run_number
        run: |
          count=$(ls -1 _posts/*.md 2>/dev/null | wc -l)
          echo "value=$((count + 1))" >> "$GITHUB_OUTPUT"

      - name: Generate post with Gemini
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: ${{ needs.parse-topic.outputs.topic }}
          CATEGORY: ${{ needs.parse-topic.outputs.category }}
          ANGLE: ${{ needs.parse-topic.outputs.angle }}
          SLUG: ${{ needs.parse-topic.outputs.slug }}
          RUN_NUMBER: ${{ steps.run_number.outputs.value }}
        run: python3 scripts/generate_post.py

      - name: Upload draft as artifact
        uses: actions/upload-artifact@v4
        with:
          name: draft-post
          path: _posts/*.md
          if-no-files-found: error

      - name: Comment draft summary on issue
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.parse-topic.outputs.issue_number }}
          POST_TITLE: ${{ steps.generate.outputs.post_title }}
        with:
          script: |
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const title = process.env.POST_TITLE;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: [
                "✅ **Draft generated.**",
                "",
                `**Title:** ${title}`,
                "",
                "_Download it from this workflow run's Artifacts section to preview. Publishing straight to the blog lands in Phase 5._"
              ].join("\n")
            });

  generate-image:
    needs: [parse-topic, generate-content]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download draft post
        uses: actions/download-artifact@v4
        with:
          name: draft-post
          path: .

      - name: Generate thumbnail image
        id: image
        env:
          TOPIC: ${{ needs.parse-topic.outputs.topic }}
          CATEGORY: ${{ needs.parse-topic.outputs.category }}
          POST_TITLE: ${{ needs.generate-content.outputs.post_title }}
          SLUG: ${{ needs.parse-topic.outputs.slug }}
        run: python3 scripts/generate_image.py

      - name: Upload draft with image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: draft-post-with-image
          path: |
            _posts/*.md
            assets/images/*.png
          if-no-files-found: warn

      - name: Comment image summary on issue
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.parse-topic.outputs.issue_number }}
          IMAGE_SOURCE: ${{ steps.image.outputs.image_source }}
        with:
          script: |
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const source = process.env.IMAGE_SOURCE;
            const body = source === "none"
              ? [
                  "⚠️ **Thumbnail generation failed** after retries — the post will publish without a hero image this time.",
                  "",
                  "_Check the `generate-image` job logs if this keeps happening._"
                ].join("\n")
              : [
                  `🖼️ **Thumbnail generated** (source: ${source}).`,
                  "",
                  "_Download `draft-post-with-image` from this run's Artifacts to preview post + image together. Publishing to the live blog lands in Phase 5._"
                ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            });

  # ---- Future phases plug in here as additional jobs ----
  # publish-blog:
  #   needs: generate-image
  #   ...
  # post-linkedin:
  #   needs: publish-blog
  #   ...
  # archive-to-repo:
  #   needs: publish-blog
  #   ...
