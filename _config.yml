title: "Yash Pandey — Tech, DevOps, Cloud & AI Blogs"
description: "Daily dispatches on tech, DevOps, and AI — written by a human, shipped by a pipeline."
url: "https://itzzyashpandey.github.io"
baseurl: "/devops-blog-pipeline"
author: "Yash Pandey"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Used in the footer — update these once
social:
  github: "https://github.com/itzzyashpandey"
  linkedin: "https://linkedin.com/in/yashpandey1272000"
  coffee: "https://buymeacoffee.com/yourusername"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
